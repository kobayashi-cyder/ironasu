[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ironasu"
version = "0.1.0"
description = "Adaptive compute-saving router for local OpenAI-compatible LLM inference"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["ironasu*"]
