[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ironasu"
version = "1.6.0"
description = "Adaptive LLM gateway, out-of-core inference, coding harness and experimental speculation scheduling"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
stream = ["torch>=2.4", "safetensors>=0.4", "transformers>=4.49,<5", "accelerate>=1.0"]

[tool.setuptools.packages.find]
include = ["ironasu*"]

[tool.setuptools.package-data]
"ironasu.web" = ["*.html", "*.css", "*.js"]

[project.scripts]
ironasu = "ironasu.server:serve"
ironasu-studio = "ironasu.desktop:main"
ironasu-desktop = "ironasu.desktop:main"
ironasu-studio-web = "ironasu.studio:main"
ironasu-harness = "ironasu.harness:main"
ironasu-team = "ironasu.team:main"
ironasu-benchmark-ab = "ironasu.benchmark:main"
ironasu-regression-gate = "ironasu.regression:main"
ironasu-benchmark-load = "ironasu.load:main"
ironasu-load-gate = "ironasu.load:gate_main"
ironasu-benchmark-capture = "ironasu.capture:main"
ironasu-state-benchmark = "ironasu.speculative_state:main"
ironasu-context = "ironasu.context_cli:main"
ironasu-diagnose = "ironasu.diagnostics:main"
ironasu-benchmark-airllm = "ironasu.airllm_benchmark:main"

ironasu-stream = "ironasu.stream:main"
ironasu-inspect = "ironasu.checkpoint:main"
ironasu-tune = "ironasu.tuner:main"

ironasu-quantize-q4 = "ironasu.q4:main"
ironasu-benchmark-q4 = "ironasu.q4_benchmark:main"
ironasu-q4-gate = "ironasu.q4_gate:main"

ironasu-moe-plan = "ironasu.moe:main"
ironasu-kimi-inspect = "ironasu.kimi:main"
