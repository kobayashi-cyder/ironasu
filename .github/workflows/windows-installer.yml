name: Installable offline Studio packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ironasu/**"
      - "build/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "ironasu/**"
      - "build/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build universal wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/wheels
      - name: Offline install wheel in empty venv
        run: |
          python -m venv /tmp/ironasu-clean
          /tmp/ironasu-clean/bin/python -m pip install --no-index --no-deps dist/wheels/*.whl
          /tmp/ironasu-clean/bin/ironasu-studio --help
          /tmp/ironasu-clean/bin/ironasu-desktop --self-test /tmp/ironasu-native-wheel.json
          cd /tmp
          /tmp/ironasu-clean/bin/python -c "from importlib.resources import files; assert files('ironasu.web').joinpath('index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: ironasu-studio-offline-python-wheel
          path: dist/wheels/*.whl
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build tools
        run: python -m pip install -e . pyinstaller
      - name: Build standalone native desktop window (bundled Python and Tk)
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name ironasu-studio --collect-data ironasu.web
          scripts/ironasu_desktop_entry.py
      - name: Smoke-test native window (no browser, no model server)
        shell: pwsh
        run: |
          $exe = ".\dist\ironasu-studio\ironasu-studio.exe"
          $target = Join-Path $env:RUNNER_TEMP "desktop-selftest.json"
          $smoke = Join-Path $env:RUNNER_TEMP "desktop-gui.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", $target) -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Desktop executable self-test timed out"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $target)) { throw "Native desktop self-test failed" }
          $report = Get-Content $target -Raw | ConvertFrom-Json
          if ($report.mode -ne "native-tk-desktop" -or $report.browser_required) { throw "Unexpected browser dependency" }
          # Hosted Windows runners may not expose an interactive desktop. Only
          # the actual Tk smoke attempt is best-effort; its outcome is explicit.
          $process = Start-Process -FilePath $exe -ArgumentList @("--smoke-gui", $smoke) -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Warning "Tk window smoke timed out in CI (likely noninteractive desktop)"
          } elseif ($process.ExitCode -ne 0 -or -not (Test-Path $smoke)) {
            Write-Warning "Tk window could not open in CI; real desktop GUI not verified by this step"
          } else {
            $gui = Get-Content $smoke -Raw | ConvertFrom-Json
            if (-not $gui.native_window_created -or $gui.agents_max -ne 16) {
              throw "Native agent GUI is missing"
            }
          }
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installers" | Out-Null
          Compress-Archive -Path "dist\ironasu-studio\*" -DestinationPath "dist\installers\ironasu-studio-1.6.0-windows-x64-portable.zip" -Force
      - name: Build offline Windows setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "build\windows\ironasu-studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Verify unattended per-user installation
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "dist\installers\*-setup.exe" | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup exit code $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\ironasu Studio\ironasu-studio.exe"
          if (-not (Test-Path $installed)) { throw "Installed executable not found" }
          $report = Join-Path $env:RUNNER_TEMP "installed-desktop.json"
          $process = Start-Process -FilePath $installed -ArgumentList @("--self-test", $report) -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Installed desktop executable did not exit"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Installed desktop app failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ironasu-studio-windows-x64-offline-installers
          path: dist/installers/*
          if-no-files-found: error
