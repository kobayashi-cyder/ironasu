name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and verify entrypoints
        run: |
          python -m pip install -e .
          ironasu-harness --help
          ironasu-studio --help
          ironasu-desktop --help
          ironasu-studio-web --help
          ironasu-studio-tk --help
          ironasu-studio --self-test /tmp/ironasu-desktop-check.json
          python -c "import json; j=json.load(open('/tmp/ironasu-desktop-check.json')); assert j['browser_required'] is False"
          ironasu-team --help
          ironasu-benchmark-ab --help
          ironasu-regression-gate --help
          ironasu-benchmark-load --help
          ironasu-load-gate --help
          ironasu-benchmark-capture --help
          ironasu-q4-gate --help
      - name: Run standard-library unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q ironasu tests
          node --check ironasu/web/ui.js
          node --test tests/test_ui_reasoning.cjs
      - name: Check bundled offline Studio assets in wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("ironasu-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              assert {"ironasu/web/index.html", "ironasu/web/ui.css", "ironasu/web/ui.js"} <= names
              assert b"https://" not in wheel.read("ironasu/web/ui.js")
          print("Offline Studio assets are packaged without external runtime dependencies.")
          PY
  native-desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Tk and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -e .
      - name: Construct all three native Tk tabs under Xvfb
        run: |
          xvfb-run -a python -m ironasu.desktop --smoke-gui /tmp/ironasu-native-ui.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/ironasu-native-ui.json', encoding='utf-8'))
          assert report['native_window_created'] is True, report
          assert report['agents_max'] == 16, report
          assert report['corpus_partitions'] == [4, 16], report
          assert len(report['tabs']) == 3, report
          print(report)
          PY
  qt6-desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      IRONASU_QT_SCREENSHOT: /tmp/ironasu-qt-preview.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux libraries required by Qt6 offscreen rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install Qt6 desktop extra (no browser engine)
        run: python -m pip install -e '.[desktop]'
      - name: Run real offscreen PySide6 UI and integration tests
        run: |
          python -m unittest tests.test_qt_desktop -v
          python -m ironasu.qt_desktop --smoke-gui /tmp/ironasu-qt-gui.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/ironasu-qt-gui.json', encoding='utf-8'))
          assert report['native_window_created'] is True, report
          assert report['qt6'] is True, report
          assert report['browser_required'] is False, report
          assert report['agents_max'] == 16, report
          assert report['splitter_panels'] == 3, report
          assert len(report['tabs']) == 3, report
          assert report['model_management'] is True, report
          print(report)
          PY
      - name: Upload Qt6 preview from offscreen renderer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironasu-qt6-preview
          path: /tmp/ironasu-qt-preview.png
          if-no-files-found: ignore
  stream-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install stream dependencies
        run: python -m pip install -e '.[stream]'
      - name: Run Q4 and locally generated Transformers integration tests
        run: |
          python -m unittest discover -s tests -p test_q4.py -v
          python -m unittest discover -s tests -p test_moe.py -v
          python -m unittest discover -s tests -p test_mxfp4.py -v
          python -m unittest discover -s tests -p test_kimi.py -v
          python -m unittest discover -s tests -p test_stream_integration.py -v
          python -m unittest discover -s tests -p test_speculative_decode.py -v
